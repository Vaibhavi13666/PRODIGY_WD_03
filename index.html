<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic · Tac · Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="board-room">

    <header class="masthead">
      <p class="eyebrow">Round <span id="roundNumber">1</span></p>
      <h1>Tic <span class="dot">·</span> Tac <span class="dot">·</span> Toe</h1>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-card" id="scoreX">
        <span class="score-label">Player X</span>
        <span class="score-value" id="scoreXValue">0</span>
      </div>
      <div class="score-card draw" id="scoreDraw">
        <span class="score-label">Draws</span>
        <span class="score-value" id="scoreDrawValue">0</span>
      </div>
      <div class="score-card" id="scoreO">
        <span class="score-label">Player O</span>
        <span class="score-value" id="scoreOValue">0</span>
      </div>
    </section>

    <p class="turn-indicator" id="turnIndicator">Player X's move</p>

    <div class="board-wrap">
      <svg class="strike-line" id="strikeLine" viewBox="0 0 300 300" preserveAspectRatio="none">
        <line id="strikeLinePath" x1="0" y1="0" x2="0" y2="0" />
      </svg>
      <div class="board" id="board" role="grid" aria-label="Tic tac toe board">
        <button class="cell" data-index="0" role="gridcell" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" role="gridcell" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" role="gridcell" aria-label="Cell
