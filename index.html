<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe | Prodigy Task 03</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <p class="round">ROUND 1</p>

            <h1>Tic <span>•</span> Tac <span>•</span> Toe</h1>

            <p class="subtitle">
                Classic strategy game
            </p>
        </header>


        <!-- Score Board -->
        <section class="scoreboard">

            <div class="score-card player-x">
                <p>PLAYER X</p>
                <strong id="scoreX">0</strong>
            </div>

            <div class="score-card draws">
                <p>DRAWS</p>
                <strong id="scoreDraws">0</strong>
            </div>

            <div class="score-card player-o">
                <p>PLAYER O</p>
                <strong id="scoreO">0</strong>
            </div>

        </section>


        <!-- Turn Message -->
        <div class="turn-box">
            <span class="turn-dot"></span>
            <span id="turnMessage">Player X's move</span>
        </div>


        <!-- Game Board -->
        <main class="game-board" id="gameBoard">

            <button class="cell" data-index="0" aria-label="Cell 1"></button>
            <button class="cell" data-index="1" aria-label="Cell 2"></button>
            <button class="cell" data-index="2" aria-label="Cell 3"></button>

            <button class="cell" data-index="3" aria-label="Cell 4"></button>
            <button class="cell" data-index="4" aria-label="Cell 5"></button>
            <button class="cell" data-index="5" aria-label="Cell 6"></button>

            <button class="cell" data-index="6" aria-label="Cell 7"></button>
            <button class="cell" data-index="7" aria-label="Cell 8"></button>
            <button class="cell" data-index="8" aria-label="Cell 9"></button>

        </main>


        <!-- Result -->
        <div class="result-message" id="resultMessage"></div>


        <!-- Buttons -->
        <div class="controls">

            <button class="control-btn new-game" id="newGameBtn">
                <span>↻</span>
                New Game
            </button>

            <button class="control-btn reset" id="resetBtn">
                Reset Score
            </button>

        </div>


        <!-- Footer -->
        <footer>
            <p>PRODIGY INFOTECH • WEB DEVELOPMENT INTERNSHIP</p>
            <p>Task 03 • Tic Tac Toe Web Application</p>
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
